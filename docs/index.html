<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOV to WebM Converter (8MB制限)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .container {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            background-color: #f9f9f9;
        }
        .drop-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            background-color: #fff;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .drop-area.highlight {
            border-color: #4CAF50;
            background-color: #f0fff0;
        }
        .file-info {
            margin: 15px 0;
        }
        .controls {
            margin-top: 15px;
        }
        progress {
            width: 100%;
            margin: 10px 0;
            display: none;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .settings {
            margin: 20px 0;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .settings label {
            display: inline-block;
            margin-right: 15px;
        }
        .log {
            max-height: 200px;
            overflow-y: auto;
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            margin-top: 20px;
            border: 1px solid #ddd;
        }
        #download-link {
            display: none;
            margin-top: 20px;
            text-align: center;
        }
        #download-link a {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            display: inline-block;
        }
        .video-preview {
            margin-top: 20px;
            text-align: center;
        }
        video {
            max-width: 100%;
            max-height: 400px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>MOV to WebM Converter (8MB制限)</h1>
    
    <div class="container">
        <div id="drop-area" class="drop-area">
            <p>ここにMOVファイルをドラッグ&ドロップするか、クリックして選択してください</p>
            <input type="file" id="file-input" accept=".mov" style="display: none;">
        </div>
        
        <div class="file-info" id="file-info"></div>
        
        <div class="settings">
            <h3>変換設定</h3>
            <div>
                <label>
                    <input type="checkbox" id="maintain-resolution" checked>
                    可能な限り解像度を維持
                </label>
            </div>
            <div>
                <label>
                    品質係数 (0-63, 低いほど高品質):
                    <input type="number" id="crf" min="0" max="63" value="30" style="width: 60px;">
                </label>
            </div>
            <div>
                <label>
                    目標ビットレート (kbps):
                    <input type="number" id="bitrate" min="100" max="10000" value="800" style="width: 80px;">
                </label>
            </div>
            <div>
                <label>
                    フレームレート:
                    <select id="framerate">
                        <option value="source">元のままの値</option>
                        <option value="30">30fps</option>
                        <option value="24">24fps</option>
                        <option value="15">15fps</option>
                    </select>
                </label>
            </div>
            <div>
                <label>
                    最大サイズ(MB):
                    <input type="number" id="max-size" min="1" max="8" value="8" style="width: 60px;" readonly>
                </label>
            </div>
        </div>
        
        <div class="controls">
            <button id="convert-btn" disabled>変換開始</button>
            <progress id="progress" value="0" max="100"></progress>
        </div>
        
        <div class="log" id="log"></div>
        
        <div id="download-link"></div>
        
        <div class="video-preview" id="video-preview"></div>
    </div>

    <script>
        // Service Workerを登録
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('Service Worker 登録成功:', registration.scope);
                        logMessage('Service Worker が登録されました');
                    })
                    .catch(error => {
                        console.error('Service Worker 登録失敗:', error);
                        logMessage('Service Worker の登録に失敗しました: ' + error);
                    });
            });
        } else {
            logMessage('このブラウザは Service Worker をサポートしていません');
        }

        // FFmpeg.wasmスクリプトを読み込み
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/ffmpeg/0.11.0/ffmpeg.min.js';
        document.head.appendChild(script);

        // DOM要素
        const dropArea = document.getElementById('drop-area');
        const fileInput = document.getElementById('file-input');
        const fileInfo = document.getElementById('file-info');
        const convertBtn = document.getElementById('convert-btn');
        const progress = document.getElementById('progress');
        const logElement = document.getElementById('log');
        const downloadLink = document.getElementById('download-link');
        const videoPreview = document.getElementById('video-preview');
        
        // 設定項目
        const maintainResolution = document.getElementById('maintain-resolution');
        const crfInput = document.getElementById('crf');
        const bitrateInput = document.getElementById('bitrate');
        const framerateSelect = document.getElementById('framerate');
        const maxSizeInput = document.getElementById('max-size');

        let selectedFile = null;
        let ffmpeg = null;

        // ドラッグ&ドロップイベント
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, unhighlight, false);
        });

        function highlight() {
            dropArea.classList.add('highlight');
        }

        function unhighlight() {
            dropArea.classList.remove('highlight');
        }

        dropArea.addEventListener('drop', handleDrop, false);
        dropArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFileSelect);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }

        function handleFile(file) {
            if (file.type !== 'video/quicktime' && !file.name.toLowerCase().endsWith('.mov')) {
                alert('MOVファイルを選択してください');
                return;
            }
            
            selectedFile = file;
            convertBtn.disabled = false;
            
            // ファイル情報を表示
            const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);
            fileInfo.innerHTML = `
                <strong>ファイル名:</strong> ${file.name}<br>
                <strong>サイズ:</strong> ${fileSizeMB} MB<br>
                <strong>タイプ:</strong> ${file.type}
            `;
            
            // 動画のメタデータを取得
            const video = document.createElement('video');
            video.preload = 'metadata';
            video.onloadedmetadata = function() {
                fileInfo.innerHTML += `
                    <strong>長さ:</strong> ${Math.round(video.duration)} 秒<br>
                    <strong>解像度:</strong> ${video.videoWidth}x${video.videoHeight}
                `;
                URL.revokeObjectURL(video.src);
            };
            video.src = URL.createObjectURL(file);

            // 既存のプレビューをクリア
            videoPreview.innerHTML = '';
            downloadLink.innerHTML = '';
            downloadLink.style.display = 'none';
        }

        // FFmpegの初期化
        async function initFFmpeg() {
            if (ffmpeg) return;
            
            logMessage('FFmpeg.wasm を初期化中...');
            
            try {
                ffmpeg = FFmpeg.createFFmpeg({ log: true });
                await ffmpeg.load();
                logMessage('FFmpeg.wasm 初期化完了');
            } catch (error) {
                logMessage('FFmpeg.wasm の初期化に失敗しました: ' + error);
                console.error(error);
                alert('FFmpeg.wasm の初期化に失敗しました。コンソールでエラーを確認してください。');
            }
        }

        // 変換開始
        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            try {
                convertBtn.disabled = true;
                progress.style.display = 'block';
                progress.value = 0;
                
                await initFFmpeg();
                
                // 入力ファイルをFFmpegの仮想ファイルシステムに書き込む
                logMessage('ファイルを読み込み中...');
                ffmpeg.FS('writeFile', 'input.mov', await fetchFile(selectedFile));
                
                const inputFileName = 'input.mov';
                const outputFileName = 'output.webm';
                
                // 変換設定を取得
                const crf = parseInt(crfInput.value);
                const bitrate = parseInt(bitrateInput.value);
                const maxSizeMB = parseInt(maxSizeInput.value);
                const maxSizeBytes = maxSizeMB * 1024 * 1024; // MB to bytes
                const framerateSetting = framerateSelect.value;
                const keepResolution = maintainResolution.checked;
                
                // FFmpegコマンドを構築
                let ffmpegArgs = [
                    '-i', inputFileName,
                    '-c:v', 'libvpx-vp9', // VP9コーデックを使用
                    '-crf', crf.toString(), // 固定品質係数
                    '-b:v', bitrate + 'k', // ビットレート
                    '-deadline', 'good', // エンコード品質と速度のバランス（best, good, realtime）
                    '-cpu-used', '2', // CPU使用率（0-5、低いほど高品質だが遅い）
                ];
                
                // フレームレート設定
                if (framerateSetting !== 'source') {
                    ffmpegArgs.push('-r', framerateSetting);
                }
                
                // 解像度設定（維持しない場合は自動的に調整）
                if (!keepResolution) {
                    ffmpegArgs.push('-vf', 'scale=trunc(oh*a/2)*2:min(720\\,ih)'); // 最大高さ720pに制限
                }
                
                // オーディオ設定
                ffmpegArgs.push(
                    '-c:a', 'libopus', // Opusオーディオコーデック
                    '-b:a', '128k', // オーディオビットレート
                    '-auto-alt-ref', '0', // オルタナティブリファレンスフレームを無効化
                    '-pass', '1', // 1パスエンコード
                    '-f', 'webm', // WebM形式
                    outputFileName // 出力ファイル名
                );
                
                // FFmpegを実行して変換
                logMessage('変換を開始します...');
                logMessage('コマンド: ffmpeg ' + ffmpegArgs.join(' '));
                
                // プログレス表示の更新関数
                ffmpeg.setProgress(({ ratio }) => {
                    const percentage = Math.round(ratio * 100);
                    progress.value = percentage;
                    logMessage(`変換中... ${percentage}%`);
                });
                
                await ffmpeg.run(...ffmpegArgs);
                
                // 出力ファイルを取得
                logMessage('変換完了。ファイルを取得中...');
                const data = ffmpeg.FS('readFile', outputFileName);
                
                // 出力ファイルのサイズチェック
                const outputSizeBytes = data.length;
                const outputSizeMB = (outputSizeBytes / (1024 * 1024)).toFixed(2);
                
                logMessage(`出力ファイルサイズ: ${outputSizeMB} MB (制限: ${maxSizeMB} MB)`);
                
                // サイズ制限を超える場合は再変換
                if (outputSizeBytes > maxSizeBytes) {
                    logMessage('制限サイズを超えています。設定を調整して再変換します...');
                    
                    // CRFを増やして品質を下げる
                    const newCrf = Math.min(crf + 10, 63);
                    const newBitrate = Math.max(Math.floor(bitrate * 0.7), 100);
                    
                    // 解像度を下げる
                    let scaleFilter = 'scale=trunc(oh*a/2)*2:min(480\\,ih)'; // 480p
                    
                    // 新しい引数を構築
                    const newArgs = [
                        '-i', inputFileName,
                        '-c:v', 'libvpx-vp9',
                        '-crf', newCrf.toString(),
                        '-b:v', newBitrate + 'k',
                        '-deadline', 'good',
                        '-cpu-used', '4',
                        '-vf', scaleFilter,
                        '-c:a', 'libopus',
                        '-b:a', '96k',
                        '-auto-alt-ref', '0',
                        '-pass', '1',
                        '-f', 'webm',
                        outputFileName
                    ];
                    
                    logMessage('再変換コマンド: ffmpeg ' + newArgs.join(' '));
                    await ffmpeg.run(...newArgs);
                    
                    // 再変換後のファイルを取得
                    const newData = ffmpeg.FS('readFile', outputFileName);
                    const newOutputSizeMB = (newData.length / (1024 * 1024)).toFixed(2);
                    logMessage(`再変換後のファイルサイズ: ${newOutputSizeMB} MB`);
                    
                    // Blobを作成
                    const blob = new Blob([newData.buffer], { type: 'video/webm' });
                    createDownloadLink(blob, selectedFile.name.replace(/\.mov$/i, '.webm'));
                } else {
                    // サイズ制限内のファイルを提供
                    const blob = new Blob([data.buffer], { type: 'video/webm' });
                    createDownloadLink(blob, selectedFile.name.replace(/\.mov$/i, '.webm'));
                }
                
                // 一時ファイルを削除
                ffmpeg.FS('unlink', inputFileName);
                ffmpeg.FS('unlink', outputFileName);
                
                logMessage('変換処理が完了しました');
            } catch (error) {
                logMessage('変換中にエラーが発生しました: ' + error);
                console.error(error);
                alert('変換中にエラーが発生しました。コンソールを確認してください。');
            } finally {
                convertBtn.disabled = false;
                progress.style.display = 'none';
            }
        });

        // ダウンロードリンクを作成
        function createDownloadLink(blob, filename) {
            const url = URL.createObjectURL(blob);
            
            downloadLink.innerHTML = `
                <a href="${url}" download="${filename}">変換したWebMファイルをダウンロード</a>
            `;
            downloadLink.style.display = 'block';
            
            // プレビュー
            videoPreview.innerHTML = `
                <h3>プレビュー</h3>
                <video controls>
                    <source src="${url}" type="video/webm">
                    お使いのブラウザはビデオタグをサポートしていません。
                </video>
            `;
        }

        // ログメッセージを表示
        function logMessage(message) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString();
            logElement.innerHTML += `[${timeStr}] ${message}<br>`;
            logElement.scrollTop = logElement.scrollHeight;
            console.log(message);
        }

        // ファイルデータを取得するヘルパー関数
        async function fetchFile(file) {
            return new Uint8Array(await file.arrayBuffer());
        }
    </script>
</body>
</html>
